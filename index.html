<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Raahz Commissions - Genshin Impact piloting services. Prices and services for abyss, ascension, exploration, farming and more."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!--
      Bruno Ace SC is self-hosted rather than pulled from fonts.googleapis.com.

      Two reasons, both about how the page felt:

      1. Speed. The Google Fonts route is two extra round-trips (the CSS, then
         the woff2) before any text can use the real face. Self-hosted, the
         preload below starts the 15 KB download during HTML parse, in parallel
         with the JS bundle, instead of after it.
      2. No reflow. `swap` paints the text immediately in a fallback face and
         then reflows the whole page when the display face arrives. Since this
         face is the card's identity, `block` is used instead: text is hidden
         for at most the ~100ms the local file takes, and then appears once, in
         the correct face, with no second layout. That swap-and-shuffle was a
         large part of the "laggy" feeling on first load.

      `font-display: block` is paired with a preload, so the font is normally
      already in the cache by the time the first text paints.
    -->
    <link
      rel="preload"
      href="./fonts/bruno-ace-sc-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Bruno Ace SC';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('./fonts/bruno-ace-sc-latin.woff2') format('woff2');
        /* The latin subset only. The card has no accented characters, so
           shipping the latin-ext file as well would be dead weight. */
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>

    <meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Raahz Card</title>
    <script>
      // Resolve the theme before first paint so the card never flashes the
      // wrong palette. Mirrors the logic in src/hooks/useTheme.js.
      (function () {
        try {
          var stored = window.localStorage.getItem('raahzcard-theme')
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
        } catch (error) {
          /* localStorage unavailable - the markup default above applies */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This card needs JavaScript. You can still read the price list at
      <a href="https://github.com/Raahz21/raahzcard">the repository</a>.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
