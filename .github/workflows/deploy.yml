name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; never cancel a live one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sticker transparency is a real build step: the source JPEG is committed
      # and the transparent PNG is derived from it. The price generator is NOT
      # run here - it reads services.html from the old plain-HTML site, which is
      # not in this repo. src/data/services.js is committed instead.
      - name: Generate sticker transparency
        run: npm run generate:stickers

      # Bakes the greyscale into the character art so the browser does not have
      # to run a filter on sixteen continuously animating images.
      - name: Prepare character artwork
        run: npm run generate:artwork

      # Catches a colour literal sneaking back into the stylesheets.
      - name: Audit colour tokens
        run: npm run audit:colors

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
